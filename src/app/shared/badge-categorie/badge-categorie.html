@switch (categorie()) {
  @case ('Alimentation') { <span class="badge alimentation">Alimentation</span> }
  @case ('Logement') { <span class="badge logement">Logement</span> }
  @case ('Transport') { <span class="badge transport">Transport</span> }
  @case ('Loisirs') { <span class="badge loisirs">Loisirs</span> }
  @case ('Études') { <span class="badge etudes">Études</span> }
}
